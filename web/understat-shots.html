<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shot creation explorer · FPL Pulse Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./understat-shots.css?v=16" />
</head>
<body class="us-shots-standalone">
  <div class="us-shots page" data-name="shots.page" data-shots-standalone>
    <header class="hero" data-name="shots.hero">
      <div class="hero-copy">
        <p class="eyebrow">Understat explore · standalone</p>
        <h1>How teams create (and concede) shots</h1>
        <p class="lede">
          Start with the player treemap, then open the matrices for situation and last-action mix —
          including a defensive (against) view and match-clock timing.
        </p>
      </div>
      <a class="back" href="./index.html#insights-understat" data-name="shots.back">← Main site</a>
    </header>

    <nav class="views" aria-label="Views" data-name="shots.views">
      <button type="button" class="view on" data-view="treemap" data-name="shots.views.treemap">Player treemap</button>
      <button type="button" class="view" data-view="situation" data-name="shots.views.situation">Situation matrix</button>
      <button type="button" class="view" data-view="last_action" data-name="shots.views.last_action">Last-action matrix</button>
      <button type="button" class="view" data-view="against" data-name="shots.views.against">Against (defence)</button>
      <button type="button" class="view" data-view="timing" data-name="shots.views.timing">Match timing</button>
      <button type="button" class="view" data-view="tempo" data-name="shots.views.tempo">Attack tempo</button>
    </nav>

    <section class="controls" aria-label="Filters" data-name="shots.controls">
      <div class="controls-main">
        <div class="controls-body">
          <div class="filters-row">
            <div class="field-stack" data-name="shots.controls.season_stack">
              <label class="field field-eq" data-name="shots.controls.season">
                <span>Season</span>
                <select id="us-season"></select>
              </label>
              <label class="check shot-only" data-name="shots.controls.per90">
                <input type="checkbox" id="us-per90" />
                <span>Per 90</span>
              </label>
              <label class="check shot-only" data-name="shots.controls.min45">
                <input type="checkbox" id="us-min45" />
                <span>45+ mins</span>
              </label>
            </div>
            <label class="field field-eq shot-only" data-name="shots.controls.metric">
              <span id="us-metric-label">Metric</span>
              <select id="us-metric">
                <option value="xg">xG</option>
                <option value="shots">Shots</option>
                <option value="sot">Shots on target</option>
                <option value="cc">Chances created</option>
                <option value="cc_xg">xG assisted</option>
              </select>
            </label>
            <div class="field field-eq shot-only" data-name="shots.controls.situations">
              <span>Situations</span>
              <div class="ms-drop" id="us-situations-drop">
                <button type="button" class="ms-toggle" id="us-situations-toggle" aria-expanded="false">All situations</button>
                <div class="ms-menu" id="us-situations-menu" hidden></div>
              </div>
            </div>
            <label class="field field-eq shot-only" id="us-against-dim-wrap" data-name="shots.controls.against_split" hidden>
              <span>Against split</span>
              <select id="us-against-dim">
                <option value="situation">Situation</option>
                <option value="last_action">Last-action group</option>
              </select>
            </label>
            <label class="field field-eq context-metric" id="us-timing-metric-wrap" data-name="shots.controls.timing_metric">
              <span>Metric</span>
              <select id="us-timing-metric">
                <option value="G">G — Goals scored</option>
                <option value="xG">xG — Expected goals</option>
                <option value="Sh">Sh — Shots taken</option>
                <option value="ShC">ShC — Shots conceded</option>
                <option value="GC">GC — Goals conceded</option>
                <option value="xGC">xGC — Expected goals against</option>
              </select>
            </label>
            <div class="field timing-gw-only" id="us-timing-gw-wrap" data-name="shots.controls.timing_gw">
              <span>Gameweeks</span>
              <div class="timing-gw" id="us-timing-gw">
                <span class="timing-gw-label" id="us-timing-gw-label">GW 1–38</span>
                <span class="dual-range">
                  <label class="range-leg">From<input id="us-gw-from" type="range" min="1" max="38" value="1" /></label>
                  <label class="range-leg">To<input id="us-gw-to" type="range" min="1" max="38" value="38" /></label>
                </span>
              </div>
            </div>
            <div class="field field-teams" data-name="shots.controls.teams">
              <span>Teams</span>
              <div id="us-team-pills" class="pills pills-teams"></div>
            </div>
          </div>
        </div>

        <div class="team-actions">
          <button type="button" class="ghost" id="us-top-teams" data-name="shots.controls.top_teams">Top 10</button>
          <button type="button" class="ghost" id="us-all-teams" data-name="shots.controls.all_teams">All teams</button>
          <button type="button" class="ghost" id="us-help-open" data-name="shots.controls.definitions">Definitions</button>
        </div>
      </div>
    </section>

    <p class="status" id="us-status" data-name="shots.status"></p>
    <div id="us-chart" class="chart" role="img" aria-label="Shot creation visualization" data-name="shots.chart.treemap"></div>
    <div id="us-matrix" class="matrix" hidden data-name="shots.chart.matrix"></div>
    <div id="us-timing" class="timing-board" hidden data-name="shots.chart.timing"></div>
    <div id="us-tempo" class="timing-board tempo-board" hidden data-name="shots.chart.tempo"></div>
    <p class="footnote" id="us-footnote" data-name="shots.footnote"></p>

    <aside id="us-drawer" class="drawer" hidden data-name="shots.drawer">
      <div class="drawer-head">
        <h2 id="us-drawer-title">Team</h2>
        <button type="button" class="ghost" id="us-drawer-close">Close</button>
      </div>
      <div id="us-drawer-body" data-name="shots.drawer.body"></div>
    </aside>

    <dialog id="us-defs" data-name="shots.defs">
      <form method="dialog" class="defs-card">
        <header>
          <h2>How to read this</h2>
          <button value="close" class="ghost">Close</button>
        </header>
        <div id="us-defs-body"></div>
      </form>
    </dialog>

    <div id="us-tip" class="tip" hidden></div>
  </div>

  <script src="./vendor/d3.min.js"></script>
  <script src="./team-colors.js?v=1"></script>
  <script src="./understat-shots.js?v=17"></script>
</body>
</html>
