<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="fplMicFill" x1="18" y1="12" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7af5c4"/>
      <stop offset="48%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#1f9a68"/>
    </linearGradient>
    <linearGradient id="fplYokeFill" x1="16" y1="16" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ee4b0"/>
      <stop offset="100%" stop-color="#2bb87a"/>
    </linearGradient>
  </defs>
  <!-- Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="#3ddc97" stroke-width="1.6" opacity="0.55"/>
  <!-- Pulse (behind mic) -->
  <path
    d="M6.5 24h6.2l2.3-8.2 3.8 16.8 2.3-8.6H22.2M25.8 24h1.6l2.1-6.8 3.4 13.6 2.1-6.8H41.5"
    stroke="#e9fffa"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Vintage mic (option A) -->
  <g>
    <!-- Base disc -->
    <ellipse cx="24" cy="37.2" rx="5.4" ry="1.7" fill="url(#fplYokeFill)" stroke="#0a1612" stroke-width="1.15"/>
    <!-- Neck -->
    <path d="M21.6 33.2h4.8v3.2c0 .9-1.1 1.5-2.4 1.5s-2.4-.6-2.4-1.5v-3.2z" fill="url(#fplYokeFill)" stroke="#0a1612" stroke-width="1.1"/>
    <!-- Yoke -->
    <path
      d="M17.2 15.6v9.4c0 3.75 3.05 6.8 6.8 6.8s6.8-3.05 6.8-6.8v-9.4"
      stroke="#0a1612"
      stroke-width="2.7"
      stroke-linecap="round"
    />
    <path
      d="M17.2 15.6v9.4c0 3.75 3.05 6.8 6.8 6.8s6.8-3.05 6.8-6.8v-9.4"
      stroke="url(#fplYokeFill)"
      stroke-width="1.55"
      stroke-linecap="round"
    />
    <!-- Pivot dots -->
    <circle cx="17.2" cy="16.2" r="1.35" fill="url(#fplMicFill)" stroke="#0a1612" stroke-width="1.05"/>
    <circle cx="30.8" cy="16.2" r="1.35" fill="url(#fplMicFill)" stroke="#0a1612" stroke-width="1.05"/>
    <!-- Capsule -->
    <rect x="18.6" y="10.4" width="10.8" height="18.4" rx="5.4" fill="url(#fplMicFill)" stroke="#0a1612" stroke-width="1.25"/>
    <!-- Grille slots -->
    <path d="M21.1 14.2h5.8M21.1 16.6h5.8M21.1 19h5.8M21.1 21.4h5.8" stroke="#0a1612" stroke-width="1.35" stroke-linecap="round" opacity="0.92"/>
  </g>
</svg>
