[build]
  publish = "web"
  # Static site — no build command. Refresh serving JSON, then deploy the web/ folder.

[build.environment]
  PYTHON_VERSION = "3.13"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
